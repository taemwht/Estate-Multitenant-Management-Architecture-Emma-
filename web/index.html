<style>
/* ================= EMMA design system =================
   Dark-first "blueprint" look: deep night background, faint architectural
   grid, glass panels, indigo→cyan accent for anything AI. Light theme via
   the toggle (data-theme="light"). Numbers use Geist Mono. */
:root{
  --bg:#070a13; --bg2:#0b1122; --panel:rgba(255,255,255,.035); --panel-solid:#0d1324; --panel-hi:rgba(255,255,255,.06);
  --ink:#e8edf7; --muted:#8a94a9; --faint:#5d6880; --line:rgba(255,255,255,.08); --line-hi:rgba(255,255,255,.14);
  --accent:#7b7bff; --accent2:#2dd4ee; --accent-ink:#fff; --soft:rgba(123,123,255,.13);
  --grad:linear-gradient(135deg,#7b7bff 0%,#4f8dff 55%,#2dd4ee 100%);
  --btn:linear-gradient(135deg,#6f6cff,#4a86ff);
  --ok:#3ddc97; --ok-soft:rgba(61,220,151,.12); --warn:#ffb454; --warn-soft:rgba(255,180,84,.12); --bad:#ff6b81; --bad-soft:rgba(255,107,129,.12);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);
  --glow:0 0 0 1px rgba(123,123,255,.35),0 8px 30px -6px rgba(79,141,255,.45);
  --grid:rgba(123,140,255,.07); --field:rgba(255,255,255,.04);
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#eef1f8; --panel:rgba(255,255,255,.75); --panel-solid:#fff; --panel-hi:#fff;
  --ink:#0c1222; --muted:#5b6579; --faint:#8a93a6; --line:#e2e6ef; --line-hi:#cfd5e2;
  --accent:#5b5bf5; --accent2:#0aa5c2; --soft:rgba(91,91,245,.09);
  --ok:#14915a; --ok-soft:#e5f6ee; --warn:#b35f00; --warn-soft:#fdf1e1; --bad:#d23a52; --bad-soft:#fdeaee;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  --glow:0 0 0 1px rgba(91,91,245,.3),0 8px 24px -8px rgba(79,141,255,.35);
  --grid:rgba(60,80,160,.06); --field:#fff;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -10%,rgba(123,123,255,.18),transparent 60%),radial-gradient(800px 500px at 95% 0%,rgba(45,212,238,.12),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit}
::selection{background:rgba(123,123,255,.35)}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-weight:700;letter-spacing:.16em;font-size:15px}
.brand .wm small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.theme{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.theme:hover{color:var(--ink);border-color:var(--line-hi)}
.theme svg{width:16px;height:16px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--soft);color:var(--accent);white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.role-super_admin{color:#f5b942;background:rgba(245,185,66,.12)}
.role-company_admin{color:#a78bfa;background:rgba(167,139,250,.13)}
.role-staff{color:#38bdf8;background:rgba(56,189,248,.12)}
.role-tenant{color:#34d399;background:rgba(52,211,153,.12)}
.role-contractor{color:#fb923c;background:rgba(251,146,60,.12)}
:root[data-theme="light"] .role-super_admin{color:#a16207} :root[data-theme="light"] .role-company_admin{color:#6d28d9}
:root[data-theme="light"] .role-staff{color:#0369a1} :root[data-theme="light"] .role-tenant{color:#047857} :root[data-theme="light"] .role-contractor{color:#c2410c}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}

/* tabs */
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:5px;margin:22px 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(10px);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 14px;color:var(--muted);cursor:pointer;border-radius:10px;white-space:nowrap;font-weight:500;font-size:14px;transition:color .15s,background .15s}
nav.tabs button:hover{color:var(--ink);background:var(--panel-hi)}
nav.tabs button.on{color:var(--ink);background:var(--soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}

/* layout + surfaces */
main{padding:4px 0 64px}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:-.02em;font-weight:650} h2{font-size:15px;margin:0 0 14px;font-weight:600;letter-spacing:-.005em}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--grad);opacity:.7}
.stat::after{content:"";position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(123,123,255,.16),transparent 70%)}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--faint);font-weight:500;font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr{transition:background .12s} .tbl tbody tr:hover{background:var(--panel-hi)}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.tbl th.num{text-align:right;font-size:11px}

/* forms */
form.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);flex:1 1 160px;font-weight:500}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px rgba(123,123,255,.18)}
select option{background:var(--panel-solid);color:var(--ink)}
select[multiple]{min-height:84px}
.btn{position:relative;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 18px -8px rgba(79,141,255,.7);transition:transform .12s,box-shadow .15s,filter .15s}
.btn:hover{filter:brightness(1.08);box-shadow:var(--glow)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--line-hi);background:var(--panel-hi);filter:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default;filter:none;box-shadow:none}
.stack{display:flex;flex-direction:column;gap:16px}
.stack label{flex:none}
.stack .btn{margin-top:4px;padding:12px 14px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px;border:1px solid transparent}
.msg.err{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)} .msg.good{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.empty{color:var(--muted);padding:6px 0}
.muted{color:var(--muted)}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel-hi);color:var(--ink)}

/* ================= start page ================= */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:64px 0 56px}
.hero h1{font-size:clamp(36px,5.4vw,60px);line-height:1.02;margin:0 0 18px;letter-spacing:-.04em;font-weight:650}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--muted);font-size:17.5px;max-width:520px;margin:0 0 28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:6px 12px 6px 10px;border-radius:999px;margin-bottom:22px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(45,212,238,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(45,212,238,0)}100%{box-shadow:0 0 0 0 rgba(45,212,238,0)}}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta .btn{padding:12px 22px;font-size:15px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.trust span{display:inline-flex;align-items:center;gap:7px} .trust i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block}
/* product-as-hero */
.stage{position:relative;border-radius:20px;border:1px solid var(--line-hi);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 30px 80px -30px rgba(40,60,160,.55);overflow:hidden;backdrop-filter:blur(14px)}
.stage::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.stage .bar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.stage .bar i{width:9px;height:9px;border-radius:50%;background:var(--line-hi)}
.stage .body{position:relative;padding:18px;display:grid;gap:12px}
.blueprint{position:relative;height:190px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px;overflow:hidden}
.blueprint svg{position:absolute;inset:0;width:100%;height:100%}
.blueprint .tag{position:absolute;font-family:var(--mono);font-size:10.5px;padding:4px 8px;border-radius:7px;background:var(--panel-solid);border:1px solid var(--line-hi);color:var(--ink);box-shadow:var(--shadow);white-space:nowrap}
.blueprint .tag b{color:var(--accent2);font-weight:500}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.mini b{display:block;font-family:var(--mono);font-weight:500;font-size:17px} .mini span{font-size:11.5px;color:var(--muted)}
.bubble{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45}
.bubble.q{justify-self:end;background:var(--btn);color:#fff;border-bottom-right-radius:4px}
.bubble.a{justify-self:start;background:var(--panel-hi);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.a .who-ai{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent2);margin-bottom:3px}
.typing{display:inline-flex;gap:3px;vertical-align:middle} .typing i{width:5px;height:5px;border-radius:50%;background:var(--accent2);animation:blink 1.2s infinite} .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
/* bento */
.section-h{font-size:clamp(24px,3.2vw,34px);margin:0 0 8px;letter-spacing:-.03em;font-weight:650;text-align:center}
.section-sub{color:var(--muted);text-align:center;max-width:560px;margin:0 auto 28px}
.kicker{display:block;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
.bento{display:grid;gap:14px;grid-template-columns:repeat(6,1fr);margin:0 0 72px}
.cell{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(12px);grid-column:span 2;transition:border-color .2s,transform .2s}
.cell:hover{border-color:var(--line-hi);transform:translateY(-2px)}
.cell.w3{grid-column:span 3} .cell.w4{grid-column:span 4}
.cell b{display:block;font-size:16px;margin:0 0 6px;letter-spacing:-.01em} .cell p{margin:0;color:var(--muted);font-size:14px}
.cell .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:16px;color:var(--accent2);background:linear-gradient(135deg,rgba(123,123,255,.18),rgba(45,212,238,.12));border:1px solid var(--line-hi)}
.cell .ic svg{width:19px;height:19px}
.cell .viz{margin-top:18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--accent),rgba(123,123,255,.15))}
.bars i.hot{background:linear-gradient(180deg,var(--accent2),rgba(45,212,238,.15))}
.flow{display:flex;gap:6px;flex-wrap:wrap}
.flow span{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line-hi);color:var(--muted)}
.flow span.on{color:var(--ink);border-color:color-mix(in srgb,var(--accent2) 50%,transparent);background:rgba(45,212,238,.08)}
.chatviz{display:grid;gap:8px;margin-top:18px}
.lockviz{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lockviz div{border:1px dashed var(--line-hi);border-radius:10px;padding:10px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.lockviz div.me{border-style:solid;border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--ink);background:var(--soft)}
.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin:0 0 72px}
.roles div{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;font-size:13.5px;color:var(--muted);backdrop-filter:blur(10px)}
.roles b{color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14.5px}
.roles b::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--grad)}
.closer{text-align:center;padding:44px 20px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(600px 200px at 50% 0%,rgba(123,123,255,.18),transparent 70%),var(--panel);margin-bottom:24px}
.closer h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin:0 0 8px}
.closer p{color:var(--muted);margin:0 0 22px}
footer{color:var(--faint);font-size:12.5px;text-align:center;padding:28px 16px;border-top:1px solid var(--line);font-family:var(--mono);letter-spacing:.03em}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin:22px auto 0;font-size:14px;display:block}
.back:hover{color:var(--ink)}
/* sign in */
.auth{max-width:420px;margin:64px auto}
.auth .mark{display:grid;place-items:center;margin-bottom:18px}
.auth .mark svg{width:56px;height:56px;filter:drop-shadow(0 8px 24px rgba(79,141,255,.45))}
.auth h1{text-align:center;font-size:26px}
.auth .card{padding:26px;border-color:var(--line-hi)}
@media (max-width:900px){

<script>
// API calls go to /api on this same site; Vercel forwards them to the EMMA API (vercel.json).
// Same-origin means no CORS and no "local network access" prompt in the browser.
const API = new URLSearchParams(location.search).get("api") || "/api";
const roleBadge = role => `<span class="badge role-${esc(role)}">${esc(ROLE_LABEL[role] || role)}</span>`;
const ROLE_LABEL = {super_admin:"Super admin", company_admin:"Company admin", staff:"Staff", tenant:"Tenant", contractor:"Contractor"};
const $app = document.getElementById("app"), $who = document.getElementById("who");
const store = {
  get(k){ try{return sessionStorage.getItem(k)}catch{return null} },
  set(k,v){ try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch{} },
};
let me = null, company = null, tab = null, cache = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n == null ? "—" : "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const day = d => d ? new Date(d.length === 10 ? d + "T00:00:00" : d).toLocaleDateString() : "—";
const today = () => new Date().toISOString().slice(0,10);

// One renewal at a time: pages fire several requests at once, and they
// should all wait for the same renewal. true = renewed, false = the
// refresh token is no longer valid (sign in again), null = server hiccup.
let renewing = null;
function renewAccess(){
  if (!renewing) renewing = (async () => {
    try {
      const r = await fetch(API + "/auth/refresh", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({refresh_token: store.get("refresh")})});
      if (r.ok) { store.set("access", (await r.json()).access_token); return true; }
      return r.status === 401 || r.status === 403 ? false : null;
    } catch { return null; }
  })().finally(() => setTimeout(() => { renewing = null; }, 0));
  return renewing;
}
async function api(method, path, body, retry = true){
  const headers = {"Content-Type":"application/json"};
  const t = store.get("access"); if (t) headers.Authorization = "Bearer " + t;
  let res;
  try { res = await fetch(API + path, {method, headers, body: body ? JSON.stringify(body) : undefined}); }
  catch { throw Object.assign(new Error("Can't reach the API. The server PC may be off."), {status:0}); }
  // The access token lasts 15 minutes; renew it quietly with the refresh
  // token (7 days) on any 401, including /auth/me. Only login/refresh
  // themselves are excluded.
  if (res.status === 401 && retry && store.get("refresh") && path !== "/auth/login" && path !== "/auth/refresh") {
    const ok = await renewAccess();
    if (ok) return api(method, path, body, false);
    if (ok === false) { logout(); throw Object.assign(new Error("Session expired, please sign in again."), {status:401}); }
    throw Object.assign(new Error("Can't reach the API right now. Please try again."), {status:0});
  }
  const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = {detail: text.slice(0, 200)}; }
  if (!res.ok) {
    let d = data && data.detail; if (Array.isArray(d)) d = d.map(x => x.msg).join("; ");
    throw Object.assign(new Error(d || res.statusText), {status: res.status});
  }
  return data;
}
const get = p => api("GET", p);
// Like api() but returns the raw Response (files, uploads), renewing the login once if needed.
async function authFetch(path, opts = {}, retry = true){
  const headers = {...(opts.headers || {})}; const t = store.get("access"); if (t) headers.Authorization = "Bearer " + t;
  const res = await fetch(API + path, {...opts, headers});
  if (res.status === 401 && retry && store.get("refresh")) { const ok = await renewAccess(); if (ok) return authFetch(path, opts, false); if (ok === false) logout(); }
  return res;
}
const errText = async res => { try { const d = await res.json(); return Array.isArray(d.detail) ? d.detail.map(x => x.msg).join("; ") : d.detail || res.statusText; } catch { return res.statusText; } };
// Open a signed lease PDF in a new tab. The tab is opened first (so pop-up blockers allow it), then filled.
async function openDoc(leaseId, docId){
  // A tab can't carry the login, so ask for a private 2-minute link to this one file.
  const w = window.open("", "_blank");
  try {
    const {url} = await api("POST", `/leases/${leaseId}/documents/${docId}/link`);
    const full = (API.startsWith("http") ? API : location.origin + API) + "/" + url;
    if (w) w.location.href = full; else location.href = full;
  } catch (e) { if (w) w.close(); alert(e.message); }
}
function pickPdf(leaseId, done){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/pdf,.pdf";
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    if (file.size > 20 * 1024 * 1024) return alert("That PDF is larger than 20 MB.");
    const fd = new FormData(); fd.append("file", file);
    const res = await authFetch(`/leases/${leaseId}/documents`, {method: "POST", body: fd});
    if (!res.ok) return alert(await errText(res));
    done();
  };
  inp.click();
}
const docLinks = (docs, leaseId, canDelete) => docs.map(d => `<span style="display:inline-flex;align-items:center;gap:4px;margin:0 6px 4px 0">
  <button class="btn sm ghost" data-doc="${d.id}" data-lease="${leaseId}" title="${esc(d.filename)} · uploaded ${day(d.uploaded_at)}">📄 ${esc(d.filename.length > 22 ? d.filename.slice(0, 20) + "…" : d.filename)}</button>${canDelete ? `<button class="btn sm ghost" data-docdel="${d.id}" data-lease="${leaseId}" title="Remove this PDF" aria-label="Remove">✕</button>` : ""}</span>`).join("");
function wireDocs(v){
  v.querySelectorAll("[data-doc]").forEach(b => b.onclick = e => { e.stopPropagation(); openDoc(b.dataset.lease, b.dataset.doc); });
  v.querySelectorAll("[data-docdel]").forEach(b => b.onclick = async e => { e.stopPropagation();
    if (!confirm("Remove this PDF from the lease?")) return;
    try { await api("DELETE", `/leases/${b.dataset.lease}/documents/${b.dataset.docdel}`); } catch (err) { alert(err.message); } reload(); });
  v.querySelectorAll("[data-upload]").forEach(b => b.onclick = e => { e.stopPropagation(); pickPdf(b.dataset.upload, reload); });
}
async function getMany(paths){ const out = {}; await Promise.all(Object.entries(paths).map(async ([k,p]) => { out[k] = await get(p); })); return out; }

function logout(){ notesStop(); chatReset(); shown = null; store.set("access", null); store.set("refresh", null); me = company = null; cache = {}; render(); }
function flash(el, text, ok){ el.innerHTML = `<div class="msg ${ok?"good":"err"}">${esc(text)}</div>`; }

/* ---------------- start page (signed out) ---------------- */
const ICON = {

  people:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M21 20c0-2.6-1.6-4.8-4-5.6"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  send:'<path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="M10 13l11-10"/>',
  house:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
};
const LOGO = id => `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a97ff"/><stop offset="1" stop-color="#2dd4ee"/></linearGradient><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151d3a"/><stop offset="1" stop-color="#090e1d"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="11" fill="url(#${id}b)" stroke="url(#${id}s)" stroke-opacity=".55"/><g fill="none" stroke="url(#${id}s)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 18.5 20 9.5l11.5 9"/><path d="M12.5 16.5V30h14.5"/><path d="M12.5 23.5h9"/></g><circle cx="20" cy="9.5" r="2.6" fill="#2dd4ee"/><circle cx="22.6" cy="23.5" r="1.9" fill="#9a97ff"/><circle cx="28.2" cy="30" r="1.9" fill="#2dd4ee"/></svg>`;
const ic = k => `<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></div>`;
const goStart = () => { history.pushState(null, "", location.pathname + location.search); shown = "start"; renderLanding(); };
function renderLanding(){
  $who.innerHTML = `<button class="btn ghost sm" data-go="signin">Sign in</button>`;
  $app.innerHTML = `
  <section class="hero">
    <div>
      <span class="eyebrow"><span class="pulse"></span>Estate Multitenant Management Architecture</span>
      <h1>The AI property manager<br>for <em>every building.</em></h1>
      <p class="lead">EMMA runs rent, leases, repairs and safety check-ins across every unit, and answers in plain language. Ask her who owes rent, report a leak, or log a payment; she works strictly within your role.</p>
      <div class="cta"><button class="btn" data-go="signin">Sign in to EMMA</button><a class="btn ghost" href="#features" id="seeHow">See what she does</a></div>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="bar"><i></i><i></i><i></i><span style="margin-left:8px">emma · portfolio overview</span></div>
      <div class="body">

let shown = null;  // which signed-out screen is on display, so a repeat event never redraws (and wipes) a form
function signedOut(){ const v = location.hash === "#signin" ? "in" : "start"; if (v === shown && $app.childElementCount) return; shown = v; return v === "start" ? renderLanding() : renderAuth(v); }

/* ---------------- auth screens ---------------- */
function renderAuth(mode = "in"){
  $who.innerHTML = "";
  $app.innerHTML = `
  <div class="auth">
    <div class="mark">${LOGO("au")}</div>

      </form>
      <div id="m"></div>
    </div>
    <button class="back" id="back">&larr; Back to start</button>
  </div>`;

const TABS = {

  contractor: [["jobs","My jobs"]],
};
TABS.staff = TABS.company_admin.filter(([k]) => k !== "accounts");

async function render(){
  if (!store.get("access")) return signedOut();
  try { me = await get("/auth/me"); company = me.company_id ? await get("/companies/me").catch(() => null) : null; }
  catch (e) { if (e.status !== 401) { $app.innerHTML = `<div class="card" style="margin-top:24px"><h2>API unreachable</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="render()">Retry</button></div>`; return; } return logout(); }
  $who.innerHTML = `${roleBadge(me.role)}<span>${esc(me.username)}${company ? " · " + esc(company.name) : ""}</span><button class="bell" id="bell" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><b id="bellN" hidden></b></button><button class="btn ghost sm" id="out">Sign out</button>`;
  document.getElementById("out").onclick = logout;
  document.getElementById("bell").onclick = notesToggle;
  notesCount();
  chatShow(true);
  const tabs = TABS[me.role] || TABS.contractor;
  if (!tab || !tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  $app.innerHTML = `<nav class="tabs">${tabs.map(([k,l]) => `<button data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("")}</nav><div id="view"></div>`;
  $app.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  showView();
}
async function showView(){
  const v = document.getElementById("view"); v.innerHTML = `<p class="muted">Loading…</p>`;
  try { await VIEWS[tab](v); } catch (e) { v.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  v.querySelectorAll("[data-jump]").forEach(c => c.onclick = e => { if (e.target.closest("button,select,input,a")) return; tab = c.dataset.jump; render(); window.scrollTo({top: 0}); });
}
const reload = () => showView();

const statusBadge = s => {
  const c = {Completed:"ok",Verified:"ok",active:"ok",Submitted:"warn","In Progress":"warn",Scheduled:"warn","On Hold":"bad",Cancelled:"bad",ended:""}[s] ?? "";

};
const table = (cols, rows, empty = "Nothing here yet.") => rows.length
  ? `<div class="scroll"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c.num?"num":""}">${c.h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num?"num":""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
  : `<p class="empty">${empty}</p>`;
function bindForm(id, handler){
  const f = document.getElementById(id); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault(); const btn = f.querySelector("button[type=submit],button:not([type])"); if (btn) btn.disabled = true;
    const m = f.parentElement.querySelector(".fmsg");
    try { await handler(Object.fromEntries(new FormData(f)), f); reload(); }
    catch (err) { if (m) flash(m, err.message); if (btn) btn.disabled = false; }
  };
}

  async payments(v){
    const {receipts, leases, units, tenants} = await getMany({receipts:"/rent-receipts", leases:"/leases", units:"/rental-units", tenants:"/tenants"});
    const unitRef = Object.fromEntries(units.map(u => [u.id, u.unit_reference]));
    const tName = Object.fromEntries(tenants.map(t => [t.id, t.name]));
    const leaseById = Object.fromEntries(leases.map(l => [l.id, l]));
    const leaseLabel = l => `${unitRef[l.rental_unit_id] || "Lease"}${l.tenant_ids.length ? " · " + l.tenant_ids.map(id => tName[id] || "tenant").join(", ") : ""}`;
    const METHOD = {check:"Check", cash:"Cash", zelle:"Zelle", venmo:"Venmo", bank_transfer:"Bank transfer", card:"Card", money_order:"Money order", other:"Other"};
    const monthName = d => d ? new Date(d.slice(0,7) + "-15T00:00:00").toLocaleDateString(undefined, {month:"short", year:"numeric"}) : "";
    const thisMonth = new Date().toISOString().slice(0,7);
    const active = leases.filter(l => l.status === "active");
    // how much has come in for each lease + month, so a split or partial month is obvious
    const monthPaid = {};
    for (const r of receipts) if (r.for_month) { const k = r.lease_id + r.for_month; monthPaid[k] = (monthPaid[k] || 0) + Number(r.amount); }
    const payer = r => r.paid_by_tenant_id ? esc(tName[r.paid_by_tenant_id] || "Tenant")
      : r.paid_by_name ? `${esc(r.paid_by_name)} <span class="muted" style="font-size:12px">· not on lease</span>` : `<span class="muted">—</span>`;
    const payerOptions = (lease, sel) => `${(lease ? lease.tenant_ids : []).map(id => `<option value="${id}" ${id === sel ? "selected" : ""}>${esc(tName[id] || "Tenant")}</option>`).join("")}<option value="" ${sel === "" ? "selected" : ""}>Not recorded</option><option value="other" ${sel === "other" ? "selected" : ""}>Someone else…</option>`;
    const methodOptions = sel => Object.entries(METHOD).map(([k, l]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${l}</option>`).join("");
    const fields = (r = {}) => {
      const lease = leaseById[r.lease_id] || active[0];
      const sel = r.paid_by_tenant_id || (r.paid_by_name ? "other" : r.id ? "" : (lease && lease.tenant_ids[0]) || "");
      return `
        <label>Paid by<select name="payer">${payerOptions(lease, sel)}</select></label>
        <label data-other style="${sel === "other" ? "" : "display:none"}">Their name<input name="paid_by_name" maxlength="120" value="${esc(r.paid_by_name || "")}" placeholder="e.g. subtenant, parent"></label>
        <label>Amount paid<input name="amount" type="number" step="0.01" min="0" required value="${r.amount ?? ""}" placeholder="${lease ? "Rent " + money(lease.monthly_rent) : ""}"></label>
        <label>For month<input name="for_month" type="month" value="${r.id ? (r.for_month || "").slice(0,7) : thisMonth}"></label>
        <label>Date received<input name="date_received" type="date" value="${r.date_received || today()}" required></label>
        <label>Method<select name="method">${methodOptions(r.method || "zelle")}</select></label>
        <label>Details<input name="method_detail" maxlength="120" value="${esc(r.method_detail || "")}" placeholder="Check #, app, reference"></label>
        <label>Late fee<input name="late_fee" type="number" step="0.01" min="0" value="${r.late_fee ?? 0}"></label>
        <label style="flex:2 1 220px">Note<input name="notes" value="${esc(r.notes || "")}"></label>`;
    };
    const body = (f, isNew) => {
      const x = Object.fromEntries(new FormData(f));
      const out = {amount: +x.amount, date_received: x.date_received, method: x.method, late_fee: +(x.late_fee || 0),
        method_detail: x.method_detail.trim() || null, notes: x.notes.trim() || null,
        for_month: x.for_month ? x.for_month + "-01" : null,
        paid_by_tenant_id: x.payer && x.payer !== "other" ? x.payer : null,
        paid_by_name: x.payer === "other" ? (x.paid_by_name.trim() || null) : null};
      if (isNew) out.lease_id = x.lease_id;
      return out;
    };
    const wire = (f, lease) => {
      const sel = f.querySelector("[name=payer]"), other = f.querySelector("[data-other]");
      sel.onchange = () => { other.style.display = sel.value === "other" ? "" : "none"; };
      const ls = f.querySelector("[name=lease_id]");
      if (ls) ls.onchange = () => { const l = leaseById[ls.value]; sel.innerHTML = payerOptions(l, (l && l.tenant_ids[0]) || ""); sel.onchange();
        f.querySelector("[name=amount]").placeholder = l ? "Rent " + money(l.monthly_rent) : ""; };
    };

    v.innerHTML = `${canWork() ? `<div class="card" id="payForm"><h2>Record a payment</h2><form id="fp" class="row">
        <label style="flex:2 1 240px">Lease<select name="lease_id" required>${active.map(l => `<option value="${l.id}">${esc(leaseLabel(l))}</option>`).join("")}</select></label>
        ${fields()}
        <button class="btn" type="submit">Record</button></form><div class="fmsg"></div></div>` : ""}
      <div class="card"><h2>${me.role === "tenant" ? "Your payments" : "Payments"}</h2>${table([
        {h:"Received", f:r => day(r.date_received)},
        {h:"Unit", f:r => esc(unitRef[(leaseById[r.lease_id] || {}).rental_unit_id] || "—")},
        {h:"For", f:r => r.for_month ? esc(monthName(r.for_month)) : `<span class="muted">—</span>`},
        {h:"Paid by", f:payer},
        {h:"Method", f:r => `${esc(METHOD[r.method] || r.method)}${r.method_detail ? `<div class="muted" style="font-size:12px">${esc(r.method_detail)}</div>` : ""}`},
        {h:"Paid", num:1, f:r => { const l = leaseById[r.lease_id];
          return `<b>${money(r.amount)}</b>${Number(r.late_fee) ? `<div class="muted" style="font-size:12px">+ ${money(r.late_fee)} late fee</div>` : ""}${l ? `<div class="muted" style="font-size:12px">of ${money(l.monthly_rent)} rent</div>` : ""}`; }},
        {h:"Month status", f:r => { const l = leaseById[r.lease_id]; if (!r.for_month || !l) return `<span class="muted">—</span>`;
          const got = monthPaid[r.lease_id + r.for_month] || 0, left = Number(l.monthly_rent) - got;
          return left > 0.004 ? `<span class="badge warn">${money(left)} left</span>` : `<span class="badge ok">Covered</span>`; }},
        {h:"Note", f:r => r.notes ? `<span class="muted" style="font-size:13px">${esc(r.notes)}</span>` : ""},
        ...(canWork() ? [{h:"", f:r => `<div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn sm ghost" data-edit="${r.id}">Edit</button>${isCoAdmin() ? `<button class="btn sm ghost" data-del="${r.id}">Delete</button>` : ""}</div>`}] : []),
      ], receipts, "No payments recorded.")}</div>`;

    const fp = document.getElementById("fp");
    if (fp) { wire(fp); bindForm("fp", (_, f) => api("POST", "/rent-receipts", body(f, true))); }
    v.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (confirm("Delete this payment? An admin can restore it later.")) { await api("DELETE", `/rent-receipts/${b.dataset.del}`); reload(); } });
    v.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
      const r = receipts.find(x => x.id === b.dataset.edit), l = leaseById[r.lease_id];
      const holder = document.getElementById("payForm");
      holder.innerHTML = `<h2>Edit payment · ${esc(l ? leaseLabel(l) : "")}</h2><form id="fe" class="row">${fields(r)}
        <button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="feCancel">Cancel</button></form><div class="fmsg"></div>`;
      const fe = document.getElementById("fe"); wire(fe);
      bindForm("fe", (_, f) => api("PATCH", `/rent-receipts/${r.id}`, body(f, false)));
      document.getElementById("feCancel").onclick = () => reload();
      holder.scrollIntoView({behavior: "smooth", block: "start"});
    });
  },

  async maint(v){
    const [{reqs, units}, cos] = [await getMany({reqs:"/maintenance-requests", units:"/rental-units"}), await companyMap()];
    const crew = canWork() ? await get("/contractors") : [];
    const crewById = Object.fromEntries(crew.map(c => [c.id, c]));
    const sent = canWork() ? Object.fromEntries((await get("/notifications/delivery").catch(() => [])).map(d => [d.entity_id, d])) : {};
    const unitRef = Object.fromEntries(units.map(u => [u.id, u.unit_reference]));
    const STAT = ["Submitted","Scheduled","In Progress","On Hold","Completed","Verified","Cancelled"];
    const DONE = ["Completed","Verified","Cancelled"];
    const form = `<form id="fm" class="row">
        <label>Unit<select name="rental_unit_id" required>${units.map(u => `<option value="${u.id}">${esc(u.unit_reference)}</option>`).join("")}</select></label>
        <label style="flex:3 1 260px">What's wrong?<input name="description" required></label>
        <label>Priority<select name="priority"><option>normal</option><option>high</option><option>emergency</option><option>low</option></select></label>
        <button class="btn" type="submit">Submit</button></form><div class="fmsg"></div>`;
    // who was told, and did they read it
    const delivery = r => {
      const c = crewById[r.assigned_contractor_id]; if (!c) return "";
      if (!c.has_login) return `<div class="deliv">No login · can't be notified</div>`;
      const d = sent[r.id]; if (!d) return `<div class="deliv">Not notified yet</div>`;
      const pinged = d.pings ? ` · pinged ×${d.pings}` : "";
      return d.read_at ? `<div class="deliv"><span class="r">✓ Read</span> ${ago(d.read_at)}${pinged}</div>`
        : `<div class="deliv"><span class="u">● Unread</span> sent ${ago(d.sent_at)}${pinged}${DONE.includes(r.status) ? "" : ` <button class="btn sm ghost" data-ping="${r.id}" type="button">Ping</button>`}</div>`;
    };
    v.innerHTML = `${me.role === "tenant" ? `<div class="card"><h2>Report a problem</h2>${form}</div>` : ""}
      ${canWork() ? `<div class="card" id="newReq" hidden><h2>New request</h2>${form}</div>` : ""}
      <div class="card"><div class="head-row"><h2>${me.role === "tenant" ? "Your requests" : "Requests"}</h2>${canWork() ? `<button class="btn sm ghost" id="newReqBtn" type="button">+ New request</button>` : ""}</div>${table([
        ...(me.role==="super_admin" ? [{h:"Company", f:r => esc(cos[r.company_id])}] : []),
        {h:"Unit", f:r => esc(unitRef[r.rental_unit_id] || "—")}, {h:"Problem", f:r => esc(r.description)},
        {h:"Priority", f:r => esc(r.priority)},
        ...(canWork() ? [
          {h:"Contractor", f:r => `<select data-crew="${r.id}"><option value="">—</option>${crew.map(c => `<option value="${c.id}" ${c.id===r.assigned_contractor_id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>${delivery(r)}`},
          {h:"Date", f:r => `<input type="date" data-date="${r.id}" value="${r.scheduled_date || ""}">`},
        ] : []),
        {h:"Status", f:r => canWork() ? `<select data-st="${r.id}">${STAT.map(s => `<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select>` : statusBadge(r.status)},
        {h:"", f:r => me.role === "tenant" && r.status === "Completed" ? `<button class="btn sm" data-ver="${r.id}">Confirm fixed</button>` : ""},
      ], reqs, "No open requests.")}</div>`;
    bindForm("fm", b => api("POST","/maintenance-requests", b));
    const nb = document.getElementById("newReqBtn");
    if (nb) nb.onclick = () => { const c = document.getElementById("newReq"); c.hidden = !c.hidden; nb.textContent = c.hidden ? "+ New request" : "Close"; if (!c.hidden) c.querySelector("[name=description]").focus(); };
    v.querySelectorAll("[data-st]").forEach(s => s.onchange = async () => { try { await api("PATCH", `/maintenance-requests/${s.dataset.st}`, {status:s.value}); } catch (e) { alert(e.message); } reload(); });
    const patch = async (id, body) => { try { await api("PATCH", `/maintenance-requests/${id}`, body); } catch (e) { alert(e.message); } reload(); };
    v.querySelectorAll("[data-crew]").forEach(s => s.onchange = () => s.value && patch(s.dataset.crew, {assigned_contractor_id:s.value}));
    v.querySelectorAll("[data-date]").forEach(i => i.onchange = () => i.value && patch(i.dataset.date, {scheduled_date:i.value}));
    v.querySelectorAll("[data-ver]").forEach(b => b.onclick = async () => { await api("POST", `/maintenance-requests/${b.dataset.ver}/verify`); reload(); });
    v.querySelectorAll("[data-ping]").forEach(b => b.onclick = async () => { b.disabled = true; try { await api("POST", `/maintenance-requests/${b.dataset.ping}/ping`); b.textContent = "Pinged ✓"; setTimeout(reload, 900); } catch (e) { alert(e.message); b.disabled = false; } });
  },

};

function mdInline(t){ return t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>"); }
function md(src){  // escape first, then a few safe markdown bits
  const lines = esc(src).split("\n"); let out = "", i = 0;
  const isRow = x => /^\s*\|/.test(x), isSep = x => /^\s*\|?[\s:|-]*-{2,}[\s:|-]*$/.test(x);
  const isUl = x => /^\s*[-*•]\s+/.test(x), isOl = x => /^\s*\d+[.)]\s+/.test(x);
  while (i < lines.length) {
    const l = lines[i];
    if (isRow(l)) {
      const rows = []; while (i < lines.length && isRow(lines[i])) rows.push(lines[i++]);
      const head = rows.length > 1 && isSep(rows[1]);
      const cells = x => x.trim().replace(/^\||\|$/g, "").split("|").map(c => mdInline(c.trim()));
      out += "<table>" + rows.filter(x => !isSep(x)).map((x, n) => "<tr>" + cells(x).map(c => head && n === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("") + "</tr>").join("") + "</table>";
    } else if (isUl(l)) {
      out += "<ul>"; while (i < lines.length && isUl(lines[i])) out += "<li>" + mdInline(lines[i++].replace(/^\s*[-*•]\s+/, "")) + "</li>"; out += "</ul>";
    } else if (isOl(l)) {
      out += "<ol>"; while (i < lines.length && isOl(lines[i])) out += "<li>" + mdInline(lines[i++].replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; out += "</ol>";
    } else if (!l.trim()) { i++; }
    else { const p = []; while (i < lines.length && lines[i].trim() && !isRow(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) p.push(mdInline(lines[i++].replace(/^#+\s*/, ""))); out += "<p>" + p.join("<br>") + "</p>"; }
  }
  return out;
}
const fieldName = k => k.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
const fieldVal = (k, v) => typeof v === "object" ? esc(JSON.stringify(v)) : /amount|rent|fee|deposit/.test(k) && !isNaN(v) ? money(v) : /date/.test(k) && /^\d{4}-\d\d-\d\d$/.test(v) ? day(v) : esc(v);
function chDraw(){
  if (!me) return;
  if (chat.view === "tg") return tgDraw();
  document.getElementById("chForm").style.display = "";
  if (!chat.log.length && !chat.busy) {
    const about = me.role === "tenant" ? "your lease, rent and repairs" : me.role === "contractor" ? "your jobs" : "your properties, tenants, rent and repairs";
    $chLog.innerHTML = `<div class="ch-m assistant"><p>Hi ${esc(me.username)}, I'm EMMA. Ask me about ${about}. I'll ask you to confirm before I change anything.</p></div>
      <div class="ch-sugg">${(CH_SUGG[me.role] || []).map(q => `<button type="button">${esc(q)}</button>`).join("")}</div>`;
    $chLog.querySelectorAll(".ch-sugg button").forEach(b => b.onclick = () => chSend(b.textContent));
    return;
  }
  $chLog.innerHTML = chat.log.map((m, n) => {
    if (m.role === "user") return `<div class="ch-m user">${esc(m.content)}</div>`;
    if (m.role === "assistant") return `<div class="ch-m assistant">${md(m.content)}</div>`;
    if (m.role === "note") return `<div class="ch-m note">${esc(m.content)}</div>`;
    const f = Object.entries(m.fields || {}).filter(([k]) => !k.endsWith("_id") && k !== "id");
    const st = m.state === "done" ? `<span class="state" style="color:var(--ok)">✓ Done</span>`
      : m.state === "cancelled" ? `<span class="state muted">Cancelled</span>`
      : m.state === "failed" ? `<span class="state" style="color:var(--bad)">Couldn't do it: ${esc(m.msg)}</span>`
      : m.state === "working" ? `<span class="muted">Working…</span>`
      : `<div class="row2"><button class="btn sm" data-ok="${n}">Confirm</button><button class="btn sm ghost" data-no="${n}">Cancel</button></div>`;
    return `<div class="ch-act"><b>${esc(m.label)}</b>${f.length ? `<dl>${f.map(([k, v]) => `<dt>${esc(fieldName(k))}</dt><dd>${fieldVal(k, v)}</dd>`).join("")}</dl>` : ""}${st}</div>`;
  }).join("") + (chat.busy ? `<div class="ch-m assistant"><span class="dots"><i></i><i></i><i></i></span></div>` : "");
  $chLog.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => chConfirm(+b.dataset.ok));
  $chLog.querySelectorAll("[data-no]").forEach(b => b.onclick = () => { const a = chat.log[+b.dataset.no]; a.state = "cancelled"; delete a.token; chSave(); chDraw(); });
  $chLog.scrollTop = $chLog.scrollHeight;
}
// What the AI gets back: the conversation text, plus a line for each confirmed/cancelled change.
function chHistory(){
  const h = [];
  for (const m of chat.log) {
    if (m.role === "user" || m.role === "assistant") h.push({role: m.role, content: m.content});
    else if (m.role === "action" && m.state && m.state !== "working")
      h.push({role: "assistant", content: `[${m.label}: ${m.state === "done" ? "the person confirmed it and it was done" : m.state === "cancelled" ? "the person cancelled it" : "failed: " + m.msg}]`});
  }
  let out = h.slice(-20);
  while (out.length && out[0].role !== "user") out.shift();
  return out;
}
async function chSend(text){
  text = String(text || "").trim(); if (!text || chat.busy) return;
  chat.log.push({role: "user", content: text}); chat.busy = true; $chIn.value = ""; $chIn.style.height = ""; chSave(); chDraw();
  try {
    const res = await api("POST", "/chat", {messages: chHistory()});
    chat.log.push({role: "assistant", content: res.reply});
    for (const a of res.actions || []) chat.log.push({role: "action", token: a.token, label: a.label, fields: a.fields});
  } catch (e) {
    chat.log.push({role: "note", content: e.status === 429 ? e.message : "EMMA couldn't answer: " + e.message});
  }
  chat.busy = false; chSave(); chDraw(); $chIn.focus();
}
async function chConfirm(n){
  const a = chat.log[n]; if (!a || !a.token) return;
  a.state = "working"; chDraw();
  try { const r = await api("POST", "/chat/confirm", {token: a.token}); a.state = r.ok ? "done" : "failed"; a.msg = r.message; }
  catch (e) { a.state = "failed"; a.msg = e.message; }
  delete a.token; chSave(); chDraw();
  if (a.state === "done") { cache = {}; reload(); }
}
/* Telegram: one bot for everyone. Linking proves this Telegram account is yours;
   after that the bot acts as your login, with exactly your access. */
let tgPoll = null;
function tgStop(){ clearInterval(tgPoll); tgPoll = null; }
async function tgDraw(state){
  document.getElementById("chForm").style.display = "none";
  const back = `<button class="btn ghost sm" id="tgBack" type="button">← Back to chat</button>`;

  if (chat.view !== "tg") return;

      <p>Message <a href="https://t.me/${esc(state.bot_username)}" target="_blank" rel="noopener">@${esc(state.bot_username)}</a>${state.telegram_username ? ` from <b>@${esc(state.telegram_username)}</b>` : ""} and EMMA answers as <b>${esc(me.username)}</b>, with the same access you have here.</p>
      <a class="btn" href="https://t.me/${esc(state.bot_username)}" target="_blank" rel="noopener">Open Telegram</a>
      <button class="btn ghost" id="tgUnlink" type="button">Unlink Telegram</button>${back}</div>`;
    document.getElementById("tgUnlink").onclick = async () => { if (!confirm("Unlink Telegram? The bot will stop answering that account.")) return; await api("DELETE", "/telegram/link"); tgDraw(); };
  } else {
    $chLog.innerHTML = `<div class="tg"><h3>Use EMMA on Telegram</h3>
      <p class="muted">Chat with EMMA from your phone. She'll answer as <b>${esc(me.username)}</b>, with exactly the access you have here.</p>
      <button class="btn" id="tgGet" type="button">Link my Telegram</button>${back}</div>`;
    document.getElementById("tgGet").onclick = async () => {
      let c; try { c = await api("POST", "/telegram/link-code"); } catch (e) { return tgDraw({error: e.message}); }
      $chLog.innerHTML = `<div class="tg"><h3>Link your Telegram</h3>
        <a class="btn" href="${esc(c.link)}" target="_blank" rel="noopener">Open in Telegram</a>

        <div class="code">/link ${esc(c.code)}</div>
        <p class="muted" id="tgWait">Waiting for Telegram… this code works for ${Math.round(c.expires_in / 60)} minutes, once.</p>${back}</div>`;
      wire(); tgStop();

      tgPoll = setInterval(async () => {

        try { const st = await api("GET", "/telegram/link"); if (st.linked) tgDraw(st); } catch {}
      }, 3000);
    };
  }
  wire();
}

const $notes = document.getElementById("notes");
let notesTimer = null;
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : new Date(t).toLocaleDateString(); };
async function notesCount(){

    if (b) { b.hidden = !unread; b.textContent = unread > 9 ? "9+" : unread; } } catch {}

}

      <b>${esc(n.title)}</b><span>${esc(n.body || "")}</span><small>${ago(n.created_at)}${n.read_at ? " · read" : ""}</small></button>`).join("")
    : `<p class="muted" style="padding:16px;margin:0;text-align:center">You're all caught up.</p>`;

/* light / dark */
const $theme = document.getElementById("themeBtn");
const SUN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`, MOON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`;
function themeIcon(){ $theme.innerHTML = document.documentElement.getAttribute("data-theme") === "light" ? MOON_SVG : SUN_SVG; }
$theme.onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("emma-theme", next); } catch {}
  themeIcon();
};
themeIcon();

render();
</script>
</body>
</html>
